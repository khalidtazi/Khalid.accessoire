<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement - Libghiti</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Libghiti</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="produits.html">Produits</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </header>

  <section class="paiement">
    <h2>Finalisez votre commande 💳</h2>
    <form class="formulaire">
      <label>Nom complet :</label>
      <input type="text" placeholder="Votre nom complet" required>

      <label>Adresse :</label>
      <input type="text" placeholder="Ex : Quartier Al Massira, Agdz" required>

      <label>Téléphone :</label>
      <input type="tel" placeholder="+212 6 12 34 56 78" required>

      <label>Méthode de paiement :</label>
      <select>
        <option>À la livraison</option>
        <option>Carte bancaire (bientôt)</option>
      </select>

      <button type="submit" class="btn">Confirmer la commande</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Libghiti. Tous droits réservés.</p>
  </footer>
</body>
</html>
